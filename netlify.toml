# ============================================================
# SwimFest — Netlify deploy config
# Static site: no build step. Publish the repo root as-is.
# ============================================================

[build]
  publish = "."
  command = ""

# Send index.html for the root
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# HTML should always be revalidated so DB-driven pages stay fresh
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS/CSS can be cached briefly
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"
